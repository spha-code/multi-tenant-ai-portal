name: Bug report
description: Something is broken or behaves unexpectedly
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please avoid pasting secrets, tokens or `.env` values.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Actual behaviour, including error messages.
      placeholder: Clicking "Create order" returns 500 from /orders...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as a user from company A
        2. Open Orders
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - backend
        - frontend
        - auth / Keycloak
        - database / RLS
        - docker / infra
        - docs
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, commit SHA or version.
      placeholder: Windows 11, Chrome 142, main@985c562

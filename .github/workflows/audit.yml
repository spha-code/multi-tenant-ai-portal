# Security audit on every PR — blocks merge on known HIGH+ advisories.
#
# This is NOT Dependabot. Dependabot (.github/dependabot.yml) only proposes
# newer versions; it never runs npm audit or pip-audit. These jobs are the
# actual vulnerability gate.
name: audit

on: [pull_request]

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ci-style check: lockfile must satisfy package.json, else fail fast
      - run: npm ci --dry-run && npm audit --audit-level=high
        working-directory: frontend

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install uv
      # --locked (not --frozen): fail if uv.lock disagrees with pyproject.toml
      # instead of silently installing the stale resolution.
      - run: uv sync --locked --no-dev && uv run --with pip-audit pip-audit
        working-directory: backend

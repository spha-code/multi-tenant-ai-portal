name: Feature request
description: Propose a new capability or an improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and who is affected?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Keep it rough. Alternatives are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: Affects tenant isolation or authorization
        - label: Requires a database migration
        - label: Requires documentation changes
